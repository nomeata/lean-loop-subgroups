version: "v0.4"

project:
  name: "Loop subgroups of F_r and the image of their stabilizer subgroups in GL_r(Z)"
  description: >-
    Formalization of J. Breitner's paper on loop subgroups of the free group F_r.
    For a loop subgroup U of F_r with r >= 3 and at most r - 2 looplets, the image
    of its stabilizer in Aut(F_r) under the abelianization map B : Aut(F_r) -> GL_r(Z)
    is the congruence subgroup of level 2 of matrices M with v M = v (mod 2), where
    v_i is 1 if the i-th loop has even length and 0 otherwise. Also formalized:
    generation of the level-2 principal congruence subgroup and of S(v), the
    general upper bound for arbitrary finite-index subgroups, the excluded case of
    r - 1 looplets, existence, uniqueness, index and a free basis of loop subgroups.
    From the author's Diplomarbeit additionally: the CosetProject algorithm with a
    correctness proof, maximality and index 2^r - 1 of S(v), the index of B(Stab U)
    in GL_r(Z), the theorem on index-two subgroups, unboundedness of the stabilizer
    index, and generators of intersections with index-two subgroups.
  authors:
    - "Joachim Breitner"
    - "Claude (Anthropic), via Claude Code"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Joachim Breitner"

