status:
  scope: >-
    Formalized: Definition 1 (for any basis of any free group), Remarks 3, 4, 6, 17,
    Lemma 5 (coordinate-free generalisation plus the paper's S_n form), Corollary 7,
    Lemma 8 (with the additional, necessary hypothesis r >= 3), Definition 9,
    Lemmas 10, 12, 13, 14, Propositions 15, 16, 18 and Theorem 1 in all of its
    formulations; existence, uniqueness, finite index, index formula and free basis of
    s_1/.../s_r loop subgroups; Example 2; the exact congruence level in the excluded
    case. From the thesis: Lemma index2intersection, the CosetProject algorithm
    (computable, with termination and correctness), Lemma unboundstabgroup, Lemmas
    stabconj and max, the index bound of the discussion, and the theorem on index-two
    subgroups. Not formalized: Example 11, the probabilistic remark in the preface,
    the Todd-Coxeter approach, subgroup-intersection and generator-rewriting procedures,
    run-time analysis, congruence-level detection, discussion examples, the GAP table,
    and the background chapter.
