    relationship: "builds-on"
    note: >-
      Uses Tau Ceti's elementary matrices in GL (transvectionUnit), the Chevalley
      commutator relation, and generation of SL_n(Z) by elementary matrices.

status:
  scope: >-
    Formalized: Definition 1 (for any basis of any free group), Remarks 3, 4, 6, 17,
    Lemma 5 (coordinate-free generalisation plus the paper's S_n form), Corollary 7,
    Lemma 8 (with the additional, necessary hypothesis r >= 3), Definition 9,
    Lemmas 10, 12, 13, 14, Propositions 15, 16, 18 and Theorem 1 in all of its
    formulations; existence of s_1/.../s_r loop subgroups with index 1 + sum(s_i - 1),
    and Example 2. Finite index of the loop subgroup is assumed as a hypothesis rather
    than derived from Definition 1. Not formalized: that s_1 is exactly the congruence
    level in Proposition 18 (only Gamma_{s_1} <= B(Stab U) is proved), uniqueness of the
    loop subgroup for given lengths, the free basis of U given after Example 2,
    Example 11, the probabilistic remark in the preface, and thesis-only material.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "LoopSubgroups.image_Stab_eq"
      file: "LoopSubgroups/Main.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - declaration: "LoopSubgroups.image_stabilizer_eq"
      file: "LoopSubgroups/General.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - declaration: "LoopSubgroups.image_Stab_eq_latticeStab"
      file: "LoopSubgroups/Excluded.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        One main agent wrote the statements, the free-group and stabilizer parts and the
        assembly; parallel sub-agents proved Lemma 5, Remark 6 / Corollary 7, Lemma 8 and
        Section 9 against statements fixed by the main agent. Checked with lake / lean.
      cost:
        wall_time: "about 2 hours, one session"
        spend_usd: "not tracked"
        hardware: "local machine (Lean builds), API for the model"
      prompting_notes: >-
        Single request to formalize the paper (with the thesis LaTeX provided), building
        on Mathlib and Tau Ceti; follow-up requests for documentation and this file.
  spend_usd: "not tracked"
  notes: >-
    The human (the author of the paper) chose the target and libraries; the code was
    written by the AI agents. See BLUEPRINT.md for the statement map.

fidelity:
  divergences: >-
    (1) Lemma 8 gets the hypothesis r >= 3; the paper's statement is false for r = 2 and
    v = (1,1), but the paper only uses r >= 3. (2) The paper does not prove that the
    generator inversions tau_j stabilize U; the formalization adds this argument.
    (3) Lemma 5 is proved in a coordinate-free generalisation, from which the paper's form
    follows. (4) Remark 17 is stated with the induced map psi given; the characteristic
    kernel hypothesis is kept but not needed. (5) Loop subgroups are assumed to have
    finite index. (6) The free group is FreeGroup ι for a finite type ι (r = card ι), with
    a transport to arbitrary free groups with arbitrary bases.

review:
  status: "agent-reviewed"
  reviewers:
    - "none (human statement review pending)"
  notes: >-
    Statements were written to match the paper and checked by the formalizing agent;
    the build, sorry-freedom and axioms were checked mechanically. No independent human
    review of the formal statements yet.

