    id: "https://doi.org/10.1007/s11856-011-0213-3"
    type: "article"
    location: "Israel Journal of Mathematics (2011); arXiv:1012.2729v2"
    relationship: "formalizes"
    license: "unknown"
    author_endorsement: "participated"
  - title: "Loop subgroups of F_r and the images of their stabilizer subgroups in GL_r(Z) (Diploma thesis)"
    authors:
