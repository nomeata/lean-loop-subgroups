automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        One main agent wrote the statements, the free-group and stabilizer parts and the
        assembly; parallel sub-agents proved Lemma 5, Remark 6 / Corollary 7, Lemma 8 and
        Section 9 against statements fixed by the main agent; in a second round, seven
        sub-agents formalized further paper and thesis material in parallel.
        Checked with lake / lean.
      cost:
        wall_time: "about 3 hours, one session"
        spend_usd: "not tracked"
        hardware: "local machine (Lean builds), API for the model"
      prompting_notes: >-
        Single request to formalize the paper (with the thesis LaTeX provided), building
        on Mathlib and Tau Ceti; follow-up requests for documentation and this file.
  spend_usd: "not tracked"
  notes: >-
    Autoformalized by Claude. The human (the author of the paper) chose the target, the
    libraries and the scope; all Lean code, statements and documentation were written by
    AI agents. See BLUEPRINT.md
    for the statement map.

fidelity:
  divergences: >-
    (1) Lemma 8 gets the hypothesis r >= 3; the paper's statement is false for r = 2 and
    v = (1,1), but the paper only uses r >= 3. (2) The paper does not prove that the
    generator inversions tau_j stabilize U; the formalization adds this argument.
    (3) Lemma 5 is proved in a coordinate-free generalisation, from which the paper's form
    follows. (4) Remark 17 is stated with the induced map psi given; the characteristic
    kernel hypothesis is kept but not needed. (5) Loop subgroups are assumed to have
    finite index (derivable, IsLoopSubgroup.finiteIndex). (6) The free group is FreeGroup ι for a finite type ι (r = card ι), with
    a transport to arbitrary free groups with arbitrary bases. (7) Thesis Lemma
    unboundstabgroup: its proof is flawed (pi(g_i)^n need not be an s_i-cycle); a
    different proof is formalized, as quantitative bounds in ENat. (8) Thesis Lemma max
    is proved for r >= 2 instead of r >= 3. (9) CosetProject: the merged check is done
    before every relator instead of once per row, Coincidence uses an explicit stack
    instead of recursion, and coset tables are functions Fin n -> letter -> Fin n.

